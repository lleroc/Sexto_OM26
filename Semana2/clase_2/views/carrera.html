
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Carreras</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    
</head>
<body class="bg-light">

    <div class="container mt-5">

        <h2 class="mb-4">Gestión de Carreras</h2>

        <button type="button" id="crearTabla" class="btn btn-primary mb-3">Crear tabla</button>

        <!-- Formulario -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                Registrar Carrera
            </div>

            <div class="card-body">
                <form id="formCarrera">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre de la carrera
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nombre"
                            name="nombre"
                            maxlength="200"
                            placeholder="Ingrese el nombre de la carrera"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-success">
                        Guardar
                    </button>
                </form>
            </div>
        </div>

        <!-- Tabla -->
        <div class="card">
            <div class="card-header bg-primary text-white">
                Listado de Carreras
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre de la carrera</th>
                            </tr>
                        </thead>

                        <tbody id="tablaCarreras">
                            <!-- Datos cargados con JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
<p id="mensaje" role="status" class="container mt-3"></p>
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="carreras.js"></script>
</body>
</html>
